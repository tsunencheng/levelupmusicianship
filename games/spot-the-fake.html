<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spot the Fake: The Art Forgery Files</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#120C24; --panel:#221840; --panel-2:#2C1F52; --line:#3F3168;
  --ink:#F7EEDC; --ink-dim:#B3A7D1; --paper:#FFF6E6; --paper-ink:#2A1B4A;
  --purple:#7F2CCB; --lily:#8BEA6E; --lily-dk:#3E8E4F; --gold:#FFC857; --pink:#FF5FA8; --orange:#FFA45B; --cyan:#6FE3FF;
  --arcade:'Bungee','Lilita One',Impact,system-ui,sans-serif;
  --display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{background:var(--night);margin:0}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:18px 48px;min-height:100%}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.bgcv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- shared bits ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(18,12,36,.78);border:1px solid #4A3B7C;border-radius:999px;padding:5px 14px 4px;font-family:var(--display);font-size:18px;color:var(--ink);backdrop-filter:blur(4px);white-space:nowrap}
button.pill:hover{border-color:var(--gold)}
.pill.pop{animation:pop .6s ease}
@keyframes pop{30%{transform:scale(1.28)}100%{transform:scale(1)}}
.btn{border:0;border-radius:999px;padding:11px 20px 9px;font-family:var(--display);font-size:18px;background:#3A2C62;color:var(--ink);box-shadow:0 4px 0 #120C24;transition:transform .08s}
.btn:hover:not(:disabled){background:#46377A}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #120C24}
.btn.go{background:var(--lily);color:#143A22;box-shadow:0 4px 0 var(--lily-dk)}
.btn.go:hover:not(:disabled){background:#A6F28E}
.btn.gold{background:var(--gold);color:#3A2600;box-shadow:0 4px 0 #B8862A}
.btn.gold:hover:not(:disabled){background:#FFD67A}
.btn:disabled{opacity:.45;cursor:default}
.play{font-family:var(--arcade);font-size:26px;letter-spacing:.06em;border:0;border-radius:16px;padding:12px 38px 10px;color:#3A2600;background:linear-gradient(180deg,#FFE9A0,#FFC857);box-shadow:0 6px 0 #B8862A,0 0 30px rgba(255,200,87,.5);animation:pulse 1.6s ease-in-out infinite}
.play:hover{filter:brightness(1.08)}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #B8862A;animation:none}
.play.pink{background:linear-gradient(180deg,#FFB3CB,#FF5FA8);color:#3A0A22;box-shadow:0 6px 0 #B02D68,0 0 30px rgba(255,95,168,.45)}
.play:disabled{opacity:.45;animation:none;box-shadow:0 6px 0 #6b5320}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-head h2{font-family:var(--arcade);font-size:24px;letter-spacing:.03em}
.section-head p{color:var(--ink-dim);font-size:14px}

/* ---------- title screen ---------- */
.hero{position:relative;border-radius:24px;overflow:hidden;background:#150E2C;box-shadow:0 0 0 2px #2E2257,0 20px 60px rgba(0,0,0,.45);min-height:560px;display:flex;flex-direction:column}
.hero-ui{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 24px;gap:6px;text-align:center}
.topbar{align-self:stretch;display:flex;justify-content:flex-end;gap:8px}
.kicker{font-weight:900;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 12px rgba(111,227,255,.6)}
.logo{font-family:var(--arcade);font-size:clamp(40px,9.5vw,92px);line-height:.92;letter-spacing:.02em;
  background:linear-gradient(180deg,#FFF1B8 0%,#FFC857 50%,#FF9A3D 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #1B0F3A) drop-shadow(0 0 22px rgba(255,200,87,.4))}
.logo span{display:block;background:linear-gradient(180deg,#FFD9F0 0%,#FF5FA8 50%,#B14CFF 100%);-webkit-background-clip:text;background-clip:text}
.hero-row{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(12px,6vw,70px);width:100%;flex-wrap:wrap;margin-top:6px}
.hero-det{position:relative;width:min(270px,58vw)}
.hero-det::after{content:"";position:absolute;left:6%;right:6%;bottom:-4px;height:26px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,200,87,.6),transparent 70%)}
.hero-actions{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:18px}
.rankline{font-family:var(--display);font-size:18px;color:var(--ink)}
.rankline small{display:block;font-family:var(--body);font-weight:700;font-size:13px;color:var(--ink-dim)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how div{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.how svg{flex:none;width:52px;height:40px}
.how b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15}
.how small{font-size:14px;color:var(--ink-dim)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.world{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.world:hover:not(:disabled){transform:translateY(-3px);border-color:var(--wc,#FFC857);box-shadow:0 10px 30px -8px var(--wc,#FFC857)}
.world canvas{display:block;width:100%;height:auto;aspect-ratio:2/1}
.world:disabled{cursor:default}
.world.locked canvas{filter:grayscale(.85) brightness(.55)}
.wnum{position:absolute;top:8px;left:8px;font-family:var(--arcade);font-size:12px;letter-spacing:.06em;background:rgba(10,6,24,.72);border-radius:8px;padding:3px 8px 1px}
.wdone{position:absolute;top:8px;right:8px;font-size:12px;font-weight:900;background:var(--gold);color:#2A1B4A;border-radius:8px;padding:2px 8px}
.lockov{position:absolute;left:0;right:0;top:0;aspect-ratio:2/1;display:grid;place-items:center;font-size:38px}
.wbody{display:flex;flex-direction:column;gap:2px;padding:10px 14px 12px}
.wname{font-family:var(--display);font-size:21px;line-height:1.1}
.wrh{font-family:var(--display);font-size:17px;color:var(--wc,#FFC857);letter-spacing:.08em}
.wau{font-size:13px;color:var(--ink-dim)}
.wmeta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.stars{letter-spacing:2px;font-size:17px;color:#4E4078}
.stars .on{color:var(--gold)}
.settings{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.settings summary{cursor:pointer;font-family:var(--display);font-size:18px}
.sgrid{display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;margin-top:12px}
.sgrid label,.sgrid .lab{font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px}
.sgrid select{font:inherit;font-weight:800;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);color:var(--ink)}
.meter{display:flex;align-items:center;gap:4px;background:rgba(18,12,36,.78);border:1px solid #4A3B7C;border-radius:999px;padding:4px}
.meter button{border:0;background:transparent;border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:18px;color:var(--ink)}
.meter button[aria-checked="true"],.meter button[aria-selected="true"]{background:var(--gold);color:#2A1B4A;box-shadow:0 2px 0 #B8862A}
.note{font-size:13px;color:var(--ink-dim);width:100%}

/* ---------- game bar ---------- */
.gbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:transparent;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.back:hover{border-color:var(--ink-dim)}
.gtitle{display:flex;flex-direction:column;flex:1;min-width:0}
.gtitle small{white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);font-weight:900}
.gtitle strong{font-family:var(--arcade);font-weight:400;font-size:24px;line-height:1.15;letter-spacing:.02em}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;background:#3A2C62;border:2px solid #57497E}
.dot.on{background:var(--gold);border-color:#D9A93E;box-shadow:0 0 8px rgba(255,200,87,.6)}

/* ---------- gallery stage ---------- */
.stage{position:relative;border-radius:20px;overflow:hidden;background:#150E2C;box-shadow:0 0 0 2px #2E2257,0 18px 50px rgba(0,0,0,.5);padding:56px 18px 0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tip{position:absolute;left:12px;right:12px;top:12px;width:fit-content;margin-inline:auto;background:rgba(20,13,40,.88);border:1px solid var(--line);border-radius:18px;padding:6px 16px;font-weight:800;font-size:14px;line-height:1.3;text-align:center;z-index:6}
.hall{position:relative;display:grid;grid-template-columns:1fr;gap:26px}
@media(min-width:720px){.hall{grid-template-columns:1fr 1fr;gap:34px}}
.easel{display:flex;flex-direction:column;align-items:center;gap:12px}
.easel .gframe{width:100%}
.plate{font-family:var(--display);font-size:15px;color:#3A2600;padding:3px 16px 1px;border-radius:5px;background:linear-gradient(180deg,#F8E3A0,#C79A38 55%,#EBCB73);box-shadow:0 2px 0 #6b4a0c,inset 0 1px 0 rgba(255,255,255,.6),0 6px 14px rgba(0,0,0,.4);text-align:center}
.floor{position:relative;height:18px}
@media(min-width:720px){.floor{height:124px}}
.det{display:none}
@media(min-width:720px){.det{display:block;position:absolute;left:18px;bottom:6px;width:116px}}
.gframe{position:relative;margin:0;padding:15px;border-radius:6px;
  background:linear-gradient(135deg,#FFE9A0 0%,#C9932B 22%,#F6D36B 45%,#9A6A14 68%,#F3CF6A 100%);
  box-shadow:inset 0 0 0 2px #7A5210,inset 0 0 0 5px rgba(255,244,190,.7),inset 0 0 0 8px #8B5E0F,0 14px 34px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.45);
  transition:box-shadow .3s}
.gframe.playing{box-shadow:inset 0 0 0 2px #7A5210,inset 0 0 0 5px rgba(255,244,190,.7),inset 0 0 0 8px #8B5E0F,0 14px 34px rgba(0,0,0,.65),0 0 60px 8px var(--wc,#FFC857)}
.cn{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6C8,#E2B23C 45%,#8B5E0F);box-shadow:0 2px 4px rgba(0,0,0,.55);z-index:4}
.cn.tl{top:-7px;left:-7px}.cn.tr{top:-7px;right:-7px}.cn.bl{bottom:-7px;left:-7px}.cn.br{bottom:-7px;right:-7px}
.art{position:relative;overflow:hidden;color:var(--paper-ink);border-radius:2px;padding:18px 10px 4px;min-height:196px;
  background:radial-gradient(120% 90% at 50% 40%,#FFF9EA 0%,#F5E9CC 70%,#E3CFA0 100%);
  box-shadow:inset 0 0 0 3px #B79B62,inset 0 0 30px rgba(90,60,20,.4)}
.art::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.canvasrow{position:relative;display:flex;gap:8px;justify-content:center;min-height:170px}
.col{flex:1;min-width:0;max-width:62px;display:flex;flex-direction:column}
.stack{flex:1;display:flex;align-items:flex-end;justify-content:center}
.dab{width:100%;max-width:58px;aspect-ratio:1/1;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;border:0;padding:0;color:var(--t,#fff);
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6) 0,rgba(255,255,255,0) 30%),radial-gradient(circle at 66% 76%,rgba(0,0,0,.22),rgba(0,0,0,0) 60%),var(--c,#999);
  border-radius:54% 46% 52% 48%/48% 54% 46% 52%;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.28),0 9px 14px rgba(60,30,0,.28);
  transition:transform .12s,box-shadow .12s;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.col:nth-child(2n) .dab{border-radius:46% 54% 48% 52%/55% 47% 53% 45%;transform:rotate(-5deg)}
.col:nth-child(3n) .dab{border-radius:50% 50% 44% 56%/52% 46% 54% 48%;transform:rotate(4deg)}
.dab.q{background:repeating-linear-gradient(45deg,#4B3A7C 0 6px,#3F3168 6px 12px);color:var(--gold);text-shadow:0 0 10px rgba(255,200,87,.7)}
button.dab{cursor:pointer}
button.dab:hover{transform:scale(1.08)}
.dab.lit{transform:scale(1.2)!important;box-shadow:0 0 0 4px var(--gold),0 0 26px var(--gold)}
.dab.sel{outline:4px solid var(--gold);outline-offset:2px;background:repeating-linear-gradient(45deg,#8A6A1C 0 6px,#79591A 6px 12px);color:#fff;text-shadow:none}
.dab.forged{outline:4px solid #E0485F;outline-offset:2px}
.stage:not(.still) .dab.pop{animation:popin .45s calc(var(--i,0)*80ms + 650ms) cubic-bezier(.2,1.5,.4,1) both}
@keyframes popin{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{opacity:1}}
.tag{height:22px;white-space:nowrap;font-size:.7rem;text-align:center;font-weight:900;color:#6E5F8F;padding-top:4px;position:relative}
.tag.bad{color:#C2263F}.tag.miss{color:#9A6A14}
.drape{position:absolute;inset:0;z-index:3;display:grid;place-items:center;border-radius:2px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 6px,rgba(255,255,255,.07) 6px 15px,rgba(0,0,0,.2) 15px 23px,transparent 23px 36px),linear-gradient(180deg,#9A2350,#5E1233 70%,#3E0B22);
  box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform 1s cubic-bezier(.6,.05,.2,1)}
.drape::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(180deg,#FFE9A0,#B8862A)}
.drape::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,#FFC857 0 3px,transparent 3px 8px);opacity:.9}
.drape.up{transform:translateY(-108%)}
.drape .qm{font-family:var(--arcade);font-size:64px;color:rgba(255,232,170,.92);text-shadow:0 0 22px rgba(255,200,87,.6),0 4px 0 rgba(0,0,0,.35);margin-top:-10px}
.pips{position:absolute;bottom:26px;left:0;right:0;display:flex;gap:9px;justify-content:center}
.pip{width:12px;height:12px;border-radius:50%;background:rgba(255,232,170,.28);transition:transform .1s}
.pip.lit{background:var(--gold);box-shadow:0 0 14px var(--gold);transform:scale(1.5)}
.stamp{position:absolute;right:-8px;top:-20px;z-index:6;font-family:var(--arcade);font-size:clamp(20px,4.4vw,30px);letter-spacing:.06em;padding:3px 12px 0;border:5px double currentColor;border-radius:9px;color:#E0264A;background:rgba(255,246,230,.95);pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.45);transform:rotate(9deg);animation:thump .5s cubic-bezier(.2,1.6,.4,1) .4s both}
.stamp.ok{color:#1F9D57}
.still .stamp{animation:none}
@keyframes thump{0%{transform:rotate(-24deg) scale(3.2);opacity:0}55%{opacity:1}100%{transform:rotate(9deg) scale(1);opacity:1}}

/* avatar */
.avatar{display:block;width:100%;height:auto}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.avatar.cheer .bob{animation:cheer .9s ease 1}
@keyframes cheer{0%{transform:translateY(0)}30%{transform:translateY(-16px) rotate(-2deg)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.avatar.shake .bob{animation:shake .6s ease 1}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
.spark{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{50%{opacity:.25;transform:scale(.6)}}

/* controls + result */
.controls{display:flex;flex-direction:column;gap:14px}
.verdicts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vbtn{font-family:var(--arcade);font-size:clamp(17px,4.6vw,26px);letter-spacing:.05em;border:0;border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.vbtn .em{font-size:2rem;line-height:1.1}
.vbtn small{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:0;opacity:.8}
.vbtn.real{background:linear-gradient(180deg,#C6FF9E,#8BEA6E);color:#12301A;box-shadow:0 6px 0 var(--lily-dk)}
.vbtn.fake{background:linear-gradient(180deg,#FFB3CB,#FF5FA8);color:#3A0A22;box-shadow:0 6px 0 #B02D68}
.vbtn:hover:not(:disabled){filter:brightness(1.07)}
.vbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.vbtn:disabled{opacity:.4;cursor:default}
.hint{text-align:center;color:var(--ink-dim);font-weight:700;font-size:14px}
.panel{background:rgba(34,24,64,.97);border:2px solid var(--line);border-radius:18px;padding:18px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;width:min(560px,100%);margin:0 auto;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.panel.good{border-color:#3E8E4F;box-shadow:0 0 0 1px #3E8E4F,0 0 40px rgba(139,234,110,.18)}
.panel.bad{border-color:#8A3A55}
.panel h3{font-family:var(--arcade);font-size:26px;letter-spacing:.02em}
.panel p{color:var(--ink-dim);font-size:15px;max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:13px;font-weight:900;border-radius:999px;padding:2px 10px;background:#3A2C62;font-variant-numeric:tabular-nums}
.chip.p{color:#7EE3A4}.chip.g{color:#FFD67A}.chip.c{color:var(--cyan)}
.total{font-family:var(--arcade);font-size:34px;color:var(--gold);text-shadow:0 0 16px rgba(255,200,87,.45);line-height:1}
.unlock{background:rgba(255,200,87,.13);border:1px solid rgba(255,200,87,.5);color:var(--gold);font-weight:800;padding:8px 14px;border-radius:12px;font-size:14px}

/* ---------- dressing room ---------- */
.shopgrid{display:grid;gap:16px}
@media(min-width:860px){.shopgrid{grid-template-columns:330px 1fr;align-items:start}.dress{position:sticky;top:12px}}
.dress{display:flex;flex-direction:column;gap:12px}
.dressstage{padding:34px 20px 14px;display:grid;place-items:center;min-height:330px}
.avwrap{position:relative;width:min(240px,64vw)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.info b{display:block;font-family:var(--arcade);font-weight:400;font-size:18px;letter-spacing:.02em}
.info span{display:block;color:var(--ink-dim);margin:2px 0 10px;font-size:14px}
.info .btn{width:100%}
.tabs{display:flex;margin-bottom:12px;overflow-x:auto;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.icard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:10px 6px 10px;background:var(--panel-2);border:2px solid var(--line);border-radius:16px;transition:transform .15s,border-color .15s,box-shadow .15s}
.icard:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 26px -10px var(--gold)}
.icard svg{width:84px;height:84px;background:radial-gradient(circle,rgba(255,255,255,.16) 0,transparent 70%);border-radius:50%}
.icard b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15}
.icard small{font-weight:800;color:var(--ink-dim);font-size:13px}
.icard.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,87,.45)}
.icard.on small{color:var(--lily)}
.icard.locked{opacity:.6}
.icard.rare{border-color:#B8862A;animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{50%{box-shadow:0 0 18px rgba(255,200,87,.5)}}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,87,.45)}
.box h3{font-family:var(--display);font-size:20px;margin-top:4px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,5,18,.8);backdrop-filter:blur(3px);overflow:auto}
.modal .panel{width:min(520px,100%);text-align:left;align-items:stretch}
.modal ol,.modal ul{margin:0;padding-left:22px;color:var(--ink-dim)}
.modal li{margin-bottom:6px}
.modal b{color:var(--ink)}
.modal .btn{align-self:center}

@media (max-width:860px){.how{grid-template-columns:1fr}}
@media (max-width:480px){.dots{display:none}.gtitle strong{font-size:20px}.play{font-size:22px;padding:10px 28px 8px}.stage{padding:52px 12px 0}.gframe{padding:12px}.art{min-height:160px}.canvasrow{min-height:140px}.drape .qm{font-size:48px}}
@media (prefers-reduced-motion:reduce){.world,.play,.icard,.bob,.pill,.drape,.stamp,.dab{transition:none!important;animation:none!important}}

function thumb(id){
  const it=ITEMS[id],base={skin:1,hair:0};
  let inner;
  if(it.slot==='outfit'){const o=OUT[id];inner=(o.back||'')+`<rect x="91" y="122" width="18" height="18" fill="${SKIN[1]}"/>`+o.front;}
  else if(it.slot==='buddy'){inner=BUD[id];}
  else if(it.slot==='prop'){inner=`<circle cx="139" cy="196" r="8" fill="${SKIN[1]}"/>`+PROP[id];}

  else {inner=headParts(base)+HAT[id];}

}

let ctx=null,master=null;
function ac(){
  try{
    if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC();master=ctx.createGain();master.gain.value=S.sound?0.5:0;master.connect(ctx.destination);}
    if(ctx.state==='suspended')ctx.resume();

  }catch(e){return null;}
}
function tone(freq,t0,dur,vol,type){
  if(!ctx)return;
  const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),f=ctx.createBiquadFilter();
  o1.type=type||'triangle';o2.type='sine';o1.frequency.value=freq;o2.frequency.value=freq*2;
  g2.gain.value=0.22;f.type='lowpass';f.frequency.value=2600;
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(f);f.connect(master);
  const v=vol||0.6;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o1.start(t0);o2.start(t0);o1.stop(t0+dur+0.05);o2.stop(t0+dur+0.05);
}
function freq(k){return DOS[S.doKey]*Math.pow(2,N[k].st/12);}
function sfx(kind){
  if(!S.sound||!ac())return;
  const t=ctx.currentTime+0.02;
  if(kind==='good'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.09,0.25,0.35));}
  else if(kind==='bad'){tone(233,t,0.28,0.35,'sawtooth');tone(174.6,t+0.2,0.4,0.35,'sawtooth');}
  else if(kind==='coin'){tone(1318.5,t,0.12,0.3);tone(1760,t+0.07,0.25,0.3);}
}
function thump(){
  if(!S.sound||!ac())return;
  const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(42,t+0.18);
  g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.26);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.3);
}
function swish(){
  if(!S.sound||!ac())return;
  const t=ctx.currentTime,len=Math.floor(ctx.sampleRate*0.6),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;bp.type='bandpass';bp.Q.value=0.9;bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(2600,t+0.55);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.12);g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
  src.connect(bp);bp.connect(g);g.connect(master);src.start(t);
}

const HALLS=new Set();let hallRAF=0,lastNow=0;
function paintArt(c,x,y,w,h,pal,r){
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  c.fillStyle=pal[Math.floor(r()*pal.length)];c.globalAlpha=.9;c.fillRect(x,y,w,h);c.globalAlpha=1;
  c.fillStyle='rgba(20,10,40,.28)';c.fillRect(x,y+h*.6,w,h*.4);
  for(let i=0;i<5;i++){
    c.fillStyle=pal[Math.floor(r()*pal.length)];c.globalAlpha=.85;
    const k=r();
    if(k<.4){c.beginPath();c.arc(x+r()*w,y+r()*h,w*(.12+r()*.2),0,Math.PI*2);c.fill();}
    else if(k<.75){c.fillRect(x+r()*w*.7,y+r()*h*.7,w*(.15+r()*.3),h*(.1+r()*.25));}
    else{c.beginPath();const ax=x+r()*w,ay=y+r()*h;c.moveTo(ax,ay);c.lineTo(ax+w*.35,ay+h*.1);c.lineTo(ax+w*.1,ay+h*.4);c.closePath();c.fill();}
  }
  c.globalAlpha=1;
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;c.beginPath();
  c.moveTo(x,y+h*(.3+r()*.4));c.bezierCurveTo(x+w*.3,y+r()*h,x+w*.6,y+r()*h,x+w,y+h*(.3+r()*.4));c.stroke();
  c.restore();
}
function paintWall(c,W,H,th,o){
  const fy=Math.round(H*.8);
  let g=c.createLinearGradient(0,0,0,fy);g.addColorStop(0,th.wt);g.addColorStop(1,th.wb);
  c.fillStyle=g;c.fillRect(0,0,W,fy);
  /* diamond lattice with motifs */
  c.save();c.beginPath();c.rect(0,0,W,fy);c.clip();
  c.strokeStyle=th.pat;c.globalAlpha=.08;c.lineWidth=1;
  const s=Math.max(38,W/15);
  for(let x=-fy;x<W+fy;x+=s){
    c.beginPath();c.moveTo(x,0);c.lineTo(x+fy,fy);c.stroke();
    c.beginPath();c.moveTo(x,fy);c.lineTo(x+fy,0);c.stroke();
  }
  c.globalAlpha=.13;c.fillStyle=th.pat;
  const nn=Math.ceil((W+fy)/s)+1;
  for(let a=-nn;a<=nn;a++){for(let b=-nn;b<=nn;b++){
    const x=(fy+a*s+b*s)/2,y=(fy+b*s-a*s)/2;
    if(x<-6||x>W+6||y<-6||y>fy+6)continue;
    c.beginPath();c.moveTo(x,y-5);c.lineTo(x+3.5,y);c.lineTo(x,y+5);c.lineTo(x-3.5,y);c.closePath();c.fill();

  c.fillStyle=g;c.fillRect(0,0,W,H*.07);
  c.fillStyle=rgba('#FFC857',.55);c.fillRect(0,Math.round(H*.05),W,2);
  /* paintings */
  if(o.art){
    const r=rng(th.pal.length*977+W);
    const n=Math.max(2,Math.min(5,Math.round(W/250)));
    const fw=Math.min(W/(n+1)*.78,fy*(o.artScale||.5)),fh=fw*1.22;
    for(let i=0;i<n;i++){
      const px=W*(i+1)/(n+1),py=fy*((o.artY||.5)+(i%2?.02:-.03))-fh/2;
      c.fillStyle='rgba(0,0,0,.4)';c.fillRect(px-fw/2+6,py+8,fw,fh);
      const gg=c.createLinearGradient(px-fw/2,py,px+fw/2,py+fh);gg.addColorStop(0,'#FFE9A0');gg.addColorStop(.35,'#C9932B');gg.addColorStop(.6,'#F6D36B');gg.addColorStop(1,'#8B5E0F');

      c.strokeStyle='rgba(90,55,10,.8)';c.lineWidth=1.5;c.strokeRect(px-fw/2+b,py+b,fw-2*b,fh-2*b);
      if(o.artDim){c.fillStyle='rgba(12,6,28,'+o.artDim+')';c.fillRect(px-fw/2,py,fw,fh);}
      c.fillStyle='#D9B04A';c.fillRect(px-fw*.18,py+fh+8,fw*.36,5);
    }
  }
  /* wainscot */
  const wy=fy-H*.17;
  c.fillStyle='rgba(0,0,0,.32)';c.fillRect(0,wy,W,fy-wy);
  c.fillStyle=rgba('#FFC857',.4);c.fillRect(0,wy,W,3);
  c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1.5;
  const pw=Math.max(70,W/7);
  for(let x=10;x<W;x+=pw){c.strokeRect(x,wy+12,pw-20,fy-wy-22);}
  c.fillStyle='rgba(0,0,0,.5)';c.fillRect(0,fy-7,W,7);
  c.fillStyle='rgba(255,255,255,.14)';c.fillRect(0,fy-7,W,1.5);
  /* floor */
  g=c.createLinearGradient(0,fy,0,H);g.addColorStop(0,th.ft);g.addColorStop(1,th.fb);
  c.fillStyle=g;c.fillRect(0,fy,W,H-fy);
  c.strokeStyle='rgba(255,255,255,.09)';c.lineWidth=1;
  const vx=W/2,vy=fy-H*.6,tt=(H-vy)/(fy-vy);
  for(let i=-14;i<=14;i++){const x=vx+i*W/9;c.beginPath();c.moveTo(x,fy);c.lineTo(vx+(x-vx)*tt,H);c.stroke();}
  for(let k=1;k<=6;k++){const y=fy+(H-fy)*Math.pow(k/6,1.7);c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  /* curtains for the dressing room */
  if(o.curtains){
    const cw=W*.2;
    [0,1].forEach(side=>{
      const x0=side?W-cw:0,n=7;
      for(let i=0;i<n;i++){
        const x=x0+i*cw/n,w=cw/n+1;
        const cg=c.createLinearGradient(x,0,x+w,0);cg.addColorStop(0,'#3A0A1E');cg.addColorStop(.5,i%2?'#A3213F':'#C92F55');cg.addColorStop(1,'#3A0A1E');
        c.fillStyle=cg;c.fillRect(x,0,w,H);
      }
      const eg=c.createLinearGradient(side?x0:x0+cw,0,side?x0-34:x0+cw+34,0);eg.addColorStop(0,'rgba(0,0,0,.5)');eg.addColorStop(1,'rgba(0,0,0,0)');
      c.fillStyle=eg;c.fillRect(side?x0-34:x0+cw,0,34,H);
    });
    const vh=H*.12;c.fillStyle='#8F1B3A';c.fillRect(0,0,W,vh*.6);
    const sc=W/8;
    for(let x=0;x<W;x+=sc){c.beginPath();c.arc(x+sc/2,vh*.6,sc/2,0,Math.PI);c.fill();}
    c.fillStyle='#FFC857';c.fillRect(0,vh*.6-3,W,3);
    for(let x=0;x<W;x+=sc){c.beginPath();c.arc(x+sc/2,vh*.6+sc/2-2,3,0,Math.PI*2);c.fill();}
    /* pedestal */
    const px=W/2,py=fy+(H-fy)*.55;
    c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(px,py+8,W*.2,(H-fy)*.2,0,0,Math.PI*2);c.fill();
    const pg=c.createLinearGradient(0,py-10,0,py+10);pg.addColorStop(0,'#5A3B9A');pg.addColorStop(1,'#2A1A55');
    c.fillStyle=pg;c.beginPath();c.ellipse(px,py,W*.2,(H-fy)*.2,0,0,Math.PI*2);c.fill();
    c.strokeStyle='#FFC857';c.lineWidth=2;c.stroke();
  }
  /* vignette */
  g=c.createRadialGradient(W/2,H*.45,Math.min(W,H)*.3,W/2,H*.5,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(6,3,16,.6)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}
function cone(cx,x,w,fy,a,tilt){
  const topW=w*.12,x2=x+(tilt||0);
  const g=cx.createLinearGradient(x,0,x2,fy);g.addColorStop(0,'rgba(255,240,205,'+a+')');g.addColorStop(1,'rgba(255,240,205,0)');
  cx.fillStyle=g;cx.beginPath();cx.moveTo(x-topW/2,-4);cx.lineTo(x+topW/2,-4);cx.lineTo(x2+w/2,fy);cx.lineTo(x2-w/2,fy);cx.closePath();cx.fill();
}
function makeHall(cv,th,opts){
  const cx=cv.getContext&&cv.getContext('2d');
  if(!cx)return null;
  const h={cv:cv,cx:cx,th:th,o:opts||{},W:0,H:0,dpr:1,layer:null,motes:[],parts:[],pulse:0,flash:0,flashCol:'255,200,87',t0:performance.now(),drawn:false};

function sizeHall(h){
  const r=h.cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  const W=Math.max(2,Math.round(r.width)),H=Math.max(2,Math.round(r.height));

  h.W=W;h.H=H;h.dpr=dpr;h.cv.width=Math.round(W*dpr);h.cv.height=Math.round(H*dpr);
  h.layer=document.createElement('canvas');h.layer.width=Math.round(W*dpr);h.layer.height=Math.round(H*dpr);
  const lc=h.layer.getContext('2d');
  if(lc){lc.scale(dpr,dpr);paintWall(lc,W,H,h.th,h.o);}
  h.drawn=false;
  if(!h.motes.length&&!RM){for(let i=0;i<(h.o.motes||0);i++)h.motes.push({x:Math.random(),y:Math.random(),v:.02+Math.random()*.04,p:Math.random()*6.28,s:.6+Math.random()*1.5});}
}
function burst(h,x,y,kind){

  const good=kind==='good',n=good?34:16;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=good?90+Math.random()*230:40+Math.random()*90;
    h.parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(good?150:20),life:0,max:good?1.3+Math.random()*.6:.9+Math.random()*.4,r:good?3+Math.random()*4:6+Math.random()*7,col:good?['#FFC857','#FFE9A0','#FFA45B','#FFFFFF'][i%4]:['#8A6A9A','#6E5F8F','#E0485F'][i%3],a:Math.random()*6.28,good:good});

function hallLoop(now){

  HALLS.forEach(h=>{
    if(!h.cv.isConnected){HALLS.delete(h);return;}
    const moving=!h.o.still&&!RM;
    if(!moving&&h.drawn&&!h.parts.length&&h.pulse<=0&&h.flash<=0)return;

  });

function drawHall(h,now,dt){
  const cx=h.cx,W=h.W,H=h.H,fy=H*.8,t=(now-h.t0)/1000,o=h.o,dpr=h.dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);

  cx.drawImage(h.layer,0,0,W,H);
  const spots=o.spots?o.spots(W,H):[];
  cx.globalCompositeOperation='lighter';
  const pu=h.pulse;
  spots.forEach(s=>{
    const a=(s.a||.2)+pu*.2+(RM?0:Math.sin(t*1.3+s.x)*.012);
    cone(cx,s.x,s.w,fy,a,0);
    const py=fy+(H-fy)*.42,pg=cx.createRadialGradient(s.x,py,2,s.x,py,s.w*.5);
    pg.addColorStop(0,'rgba(255,240,205,'+(a*1.5)+')');pg.addColorStop(1,'rgba(255,240,205,0)');
    cx.fillStyle=pg;cx.save();cx.translate(s.x,py);cx.scale(1,.28);cx.translate(-s.x,-py);

    });
  }

}

/* ---------- note playback ---------- */
function lit(w,i,on){
  if(V!=='case')return;
  const a=document.querySelectorAll('#'+w+' .dab'),b=document.querySelectorAll('#'+w+' .pip');
  if(a[i])a[i].classList.toggle('lit',on);
  if(b[i])b[i].classList.toggle('lit',on);
  if(on&&stageHall)stageHall.pulse=1;
}
function setBusy(){document.querySelectorAll('[data-play]').forEach(function(b){b.disabled=busy;});}
function frameGlow(w,on){const f=document.getElementById(w==='orig'?'fr-orig':'fr-sus');if(f)f.classList.toggle('playing',on);}
function play(kind){
  if(busy||!G)return;
  const c=ac();
  busy=true;setBusy();
  const beat=TEMPO[S.tempo]||0.6;
  const parts=kind==='orig'?[['orig',G.orig]]:kind==='sus'?[['sus',G.sus]]:[['orig',G.orig],['sus',G.sus]];
  let t=(c?c.currentTime:0)+0.12,ms=120;
  parts.forEach(function(pt){
    const w=pt[0];
    setTimeout(function(){frameGlow(w,true);},ms);
    pt[1].forEach(function(k,i){
      if(c)tone(freq(k),t+i*beat,beat*0.92);
      setTimeout(function(){lit(w,i,true);},ms+i*beat*1000);
      setTimeout(function(){lit(w,i,false);},ms+i*beat*1000+beat*880);
    });
    const dur=pt[1].length*beat+beat*0.9;
    setTimeout(function(){frameGlow(w,false);},ms+dur*1000-beat*300);
    t+=dur;ms+=dur*1000;
  });
  const heardSus=kind!=='orig';
  setTimeout(function(){
    busy=false;
    if(heardSus&&G&&!G.heard){G.heard=true;if(G.phase==='study')G.phase='vote';if(V==='case')render();}
    else setBusy();
  },ms);
}

/* ---------- puzzle generation ---------- */
function genOriginal(L){
  const pool=L.pool;
  for(let t=0;t<400;t++){
    const len=L.len[0]+rnd(L.len[1]-L.len[0]+1);
    let i=rnd(pool.length);const seq=[pool[i]];
    for(let k=1;k<len;k++){
      const c=[];
      pool.forEach((p,j)=>{if(j===i)return;const d=Math.abs(j-i);c.push([j,d===1?4:d===2?3:d===3?1.5:0.7]);});
      i=wpick(c);seq.push(pool[i]);
    }
    if(new Set(seq).size<3)continue;
    if(L.newest&&Math.random()<0.75&&!seq.some(k=>L.newest.includes(k)))continue;
    if(recent.includes(seq.join(' ')))continue;
    return seq;
  }
  return L.pool.slice(0,4);
}
function makeFake(seq,L){
  const k=L.changes[0]+rnd(L.changes[1]-L.changes[0]+1);
  const pos=shuffle(seq.map((_,i)=>i)).slice(0,k).sort((a,b)=>a-b);
  const out=seq.slice();
  pos.forEach(p=>{
    const cur=seq[p],ci=L.pool.indexOf(cur);
    let c=L.pool.map((n,j)=>[j,Math.abs(j-ci)]).filter(x=>x[0]!==ci);
    if(L.obvious){const far=c.filter(x=>Math.abs(N[L.pool[x[0]]].st-N[cur].st)>=4);if(far.length)c=far;}
    out[p]=L.pool[wpick(c.map(x=>[x[0],L.obvious?1:(x[1]===1?4:x[1]===2?2:1)]))];
  });
  return {fake:out,pos:pos};
}

function newCase(){
  const L=LEVELS[S.level];
  const orig=genOriginal(L);
  recent.push(orig.join(' '));if(recent.length>8)recent.shift();
  let isFake=Math.random()<0.55;
  const l3=recentTypes.slice(-3);
  if(l3.length===3&&l3.every(function(x){return x===l3[0];}))isFake=!l3[0];
  recentTypes.push(isFake);
  let sus=orig.slice(),pos=[];
  if(isFake){const f=makeFake(orig,L);sus=f.fake;pos=f.pos;}
  G={no:S.cases+1,level:S.level,orig:orig,sus:sus,isFake:isFake,pos:pos,phase:'study',heard:false,sel:new Set(),earn:null,unlock:0,ok:false,noteOk:false,react:'',line:'',liftShown:false,stamped:false};
}

/* ---------- game actions ---------- */
function vote(sayFake){
  if(!G||!G.heard||(G.phase!=='vote'&&G.phase!=='study'))return;
  if(sayFake&&G.isFake){G.phase='pick';swish();render();return;}
  finish(sayFake===G.isFake,false);
}
function toggle(i){
  if(!G||G.phase!=='pick')return;
  if(G.sel.has(i))G.sel.delete(i);else G.sel.add(i);
  render();
}
function accuse(){
  if(!G||G.phase!=='pick'||!G.sel.size)return;
  const a=Array.from(G.sel).sort(function(x,y){return x-y;}).join(),b=G.pos.join();
  finish(true,a===b);
}
const CHEER=['Elementary!','Sharp ears, detective.','Nothing gets past you.','One for the case book.'];
const OOPS=['The forger is clever.','Listen again and compare.','Even Holmes had off days.','Next case, next chance.'];
function burstAtSuspect(kind){
  const st=$('.stage'),fr=$('#fr-sus');
  if(!st||!fr||!stageHall)return;
  const a=st.getBoundingClientRect(),b=fr.getBoundingClientRect();
  burst(stageHall,b.left-a.left+b.width/2,b.top-a.top+b.height/2,kind);
}
function finish(verdictOk,noteOk){
  const wasLifted=G.phase==='pick';
  const e={verdict:0,note:0,streak:0,total:0};
  if(verdictOk){
    S.streak++;S.best=Math.max(S.best,S.streak);S.correct++;
    e.verdict=10;
    if(G.isFake&&noteOk)e.note=10;
    e.streak=Math.min(S.streak-1,5)*2;
    e.total=e.verdict+e.note+e.streak;
    S.coins+=e.total;
    S.prog[G.level]=(S.prog[G.level]||0)+1;
    if(S.prog[G.level]>=NEED&&S.maxLevel===G.level&&G.level<5){S.maxLevel=G.level+1;G.unlock=S.maxLevel;}
  }else{S.streak=0;}
  S.cases++;
  G.ok=verdictOk;G.noteOk=noteOk;G.earn=e;G.phase='result';
  G.react=verdictOk?'cheer':'shake';
  const arr=verdictOk?CHEER:OOPS;G.line=arr[rnd(arr.length)];
  save();
  if(!wasLifted)swish();
  setTimeout(function(){thump();sfx(verdictOk?'good':'bad');},wasLifted?420:520);
  render();
  const c=$('#coins');if(c&&verdictOk)c.classList.add('pop');
  setTimeout(function(){burstAtSuspect(verdictOk?'good':'bad');},wasLifted?450:550);
}

function dabs(seq,L,mode){
  const sts=L.pool.map(function(k){return N[k].st;}),lo=Math.min.apply(null,sts),hi=Math.max.apply(null,sts),range=Math.max(hi-lo,1),H=60;

      inner='<div class="dab" style="--c:'+n.col+';--t:'+n.t+';margin-bottom:'+y+'px">'+esc(n.lab)+'</div>';
    }else if(mode==='hidden'){

  }
  return '<div class="wrap"><div class="gbar"><button class="back" data-act="home">\u2039 Back</button><div class="gtitle"><small>Wardrobe</small><strong>Dressing room</strong></div>'+soundBtn()+coinPill()+'</div>'+
  '<div class="shopgrid"><div class="dress"><div class="stage dressstage"><canvas class="bgcv" data-hall="dress" aria-hidden="true"></canvas><div class="avwrap">'+avatar(prev,'')+'</div></div><div class="box">'+info+'</div></div>'+
  '<div class="box"><div class="tabs meter" role="tablist">'+TABS.map(function(t){return '<button role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(SH.tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>'+body+'</div></div></div>';
}
function helpModal(){
  return '<div class="modal" role="dialog" aria-modal="true" aria-label="How to play"><div class="panel"><h3>How to play</h3>'+
  '<ol><li>Tap <b>Hear the original</b> and sing it back in solfa.</li><li>Tap <b>Examine the suspect</b>. It is either identical or has forged notes.</li><li>Decide: \ud83d\udc4d <b>Genuine</b> or \ud83d\udc4e <b>Forgery</b>.</li><li>If you called a forgery and were right, tap the note or notes that changed.</li></ol>'+
  '<p>The original hangs in paint dabs, and higher notes sit higher. The suspect stays under the cloth, so trust your ears.</p>'+
  '<ul><li>Right verdict: <b>10 coins</b>.</li><li>Pinpoint the forged notes: <b>10 bonus coins</b>.</li><li>Streaks add up to <b>10 more</b>.</li><li>Solve '+NEED+' cases to open the next gallery.</li></ul>'+
  '<button class="btn go" data-act="closehelp">Got it</button></div></div>';
}
const app=$('#app');
function render(){
  let h='';
  if(V==='case'&&G)h=caseView();
  else if(V==='shop')h=shopView();
  else{V='home';h=homeView();}
  app.innerHTML=h+(M==='help'?helpModal():'');
  postRender();
}
function postRender(){
  mountHalls();
  if(V==='case'&&G){
    const d=document.querySelector('.drape[data-anim]');
    if(d){void d.offsetWidth;d.classList.add('up');d.removeAttribute('data-anim');}
    if(G.phase==='pick'||G.phase==='result')G.liftShown=true;
    if(G.phase==='result')G.stamped=true;
  }
  if(M){const b=document.querySelector('.modal .btn');if(b)b.focus();}
}
function go(v){V=v;if(v!=='home')resetArm=false;M=null;render();window.scrollTo(0,0);}

/* ---------- events ---------- */
function act(a,el){
  switch(a){
    case 'start':if(!G||G.phase==='result'||G.level!==S.level)newCase();go('case');break;
    case 'play-level':{const n=+el.dataset.n;if(n<=S.maxLevel){S.level=n;save();newCase();go('case');}break;}
    case 'home':go('home');break;
    case 'shop':go('shop');break;
    case 'help':M='help';render();break;
    case 'closehelp':M=null;render();break;
    case 'play-orig':play('orig');break;
    case 'play-sus':play('sus');break;
    case 'play-both':play('both');break;
    case 'real':vote(false);break;
    case 'fake':vote(true);break;
    case 'tog':toggle(+el.dataset.i);break;
    case 'accuse':accuse();break;
    case 'next':newCase();render();window.scrollTo(0,0);break;
    case 'nextlevel':S.level=S.maxLevel;save();newCase();render();window.scrollTo(0,0);break;
    case 'tab':SH.tab=el.dataset.tab;SH.sel=null;render();break;
    case 'sel':SH.sel=SH.sel===el.dataset.id?null:el.dataset.id;render();break;
    case 'buy':{const id=el.dataset.id,it=ITEMS[id];if(it&&S.owned.indexOf(id)<0&&it.lv<=S.maxLevel&&S.coins>=it.price){S.coins-=it.price;S.owned.push(id);S.eq[it.slot]=id;save();sfx('coin');render();const c=$('#coins');if(c)c.classList.add('pop');}break;}
    case 'wear':{const id=el.dataset.id,it=ITEMS[id];if(it&&S.owned.indexOf(id)>-1){S.eq[it.slot]=id;save();render();}break;}
    case 'off':{const s=el.dataset.slot;if(s!=='outfit'){S.eq[s]=null;save();SH.sel=null;render();}break;}
    case 'skin':S.eq.skin=+el.dataset.i;save();render();break;
    case 'hair':S.eq.hair=+el.dataset.i;save();render();break;
    case 'sound':S.sound=!S.sound;if(master)master.gain.value=S.sound?0.5:0;save();render();break;
    case 'tempo':S.tempo=el.dataset.v;save();render();break;
    case 'unlockall':S.maxLevel=5;save();render();break;
    case 'reset':
      if(!resetArm){resetArm=true;render();}
      else{const keep={sound:S.sound,doKey:S.doKey,tempo:S.tempo};S=Object.assign(defaults(),keep);G=null;resetArm=false;save();render();}
      break;
  }
}
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  act(b.dataset.act,b);
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='doSel'){S.doKey=e.target.value;save();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&M){M=null;render();}
});
render();
})();
</script>
</body>
</html>
